- defaults:
    link:
      create: true
      relink: true

- clean:
    ~/:
    ~/.config:
      recursive: true

- link:
    ~/.tmux.conf: tmux.conf
    ~/.config/nvim:
        path: nvim
        force: true
    ~/.config/ghostty:
        path: ghostty
        force: true
    ~/.gitconfig: .gitconfig
    ~/.gitconfig-work: .gitconfig-work
    ~/.gitignore_global: .gitignore_global
    ~/.bash_profile: .bash_profile
    ~/.gnupg/common.conf: gnupg/common.conf
    ~/.gnupg/gpg.conf: gnupg/gpg.conf
    ~/.claude/CLAUDE.md:
        path: claude/CLAUDE.md
        force: true
    ~/.claude/agents: claude/agents
    ~/.claude/skills: claude/skills

- create:
    ~/src:
        mode: 0775

- shell:
    - sed -e 's|PINENTRYPATH|'"$(pwd)"'/gpg-pinentry|' gnupg/gpg-agent.conf > ~/.gnupg/gpg-agent.conf
    - chown -R "$USER" ~/.gnupg
    - nvim --headless -c "lua vim.pack.update(nil, { target = 'lockfile' })" -c "w" -c "qa"
