- defaults:
    link:
      create: true
      relink: true

- clean:
    ~/:
    ~/.config:
      recursive: true

- link:
    ~/.Brewfile: Brewfile
    ~/.tmux.conf: tmux.conf
    ~/.config/nvim:
        path: nvim
        force: true
    ~/.config/ghostty:
        path: ghostty
        force: true
    ~/.gitconfig: .gitconfig
    ~/.gitconfig-work: .gitconfig-work
    ~/.gitignore_global: .gitignore_global
    ~/.bash_profile: .bash_profile
    ~/.gnupg/common.conf: gnupg/common.conf
    ~/.gnupg/gpg.conf: gnupg/gpg.conf
    ~/.claude/CLAUDE.md:
        path: claude/CLAUDE.md
        force: true
    ~/.claude/agents: claude/agents
    ~/.claude/skills/:
        glob: true
        path: claude/skills/*

- shell:
    - description: Enable Touch ID for sudo
      command: |
        [ "$(uname)" = "Darwin" ] || exit 0
        if ! grep -qs '^auth.*pam_tid.so' /etc/pam.d/sudo_local; then
          echo 'auth       sufficient     pam_tid.so' | sudo tee /etc/pam.d/sudo_local >/dev/null
        fi
      stdin: true
      stdout: true
      stderr: true
    - description: Install Homebrew
      command: |
        [ "$(uname)" = "Darwin" ] || exit 0
        [ -x /opt/homebrew/bin/brew ] && exit 0
        /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
      stdin: true
      stdout: true
      stderr: true
    - description: Install Homebrew packages
      command: |
        [ "$(uname)" = "Darwin" ] || exit 0
        eval "$(/opt/homebrew/bin/brew shellenv)"
        brew bundle --global
      stdin: true
      stdout: true
      stderr: true
    - description: Install nvm
      command: |
        [ -d ~/.nvm/.git ] && exit 0
        # Homebrew's nvm leaves symlinks here that block the installer's git checkout.
        [ ! -L ~/.nvm/nvm.sh ] || rm -f ~/.nvm/nvm.sh ~/.nvm/nvm-exec
        curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.8/install.sh | PROFILE=/dev/null bash
      stdout: true
      stderr: true
    - description: Register Homebrew bash as login shell
      command: |
        [ "$(uname)" = "Darwin" ] || exit 0
        BASH_PATH="/opt/homebrew/bin/bash"
        grep -qxF "$BASH_PATH" /etc/shells || echo "$BASH_PATH" | sudo tee -a /etc/shells
        [ "$SHELL" = "$BASH_PATH" ] || chsh -s "$BASH_PATH"
      stdin: true
      stdout: true
      stderr: true
    - description: Setup pinentry for GPG
      command: sed -e 's|PINENTRYPATH|'"$(pwd)"'/gpg-pinentry|' gnupg/gpg-agent.conf > ~/.gnupg/gpg-agent.conf
    - description: Fix ~/.gnupg permissions
      command: |
        chown -R "$USER" ~/.gnupg
        chmod 700 ~/.gnupg
        find ~/.gnupg -type d -exec chmod 700 {} +
        find ~/.gnupg -type f -exec chmod 600 {} +
      stderr: true
    - description: Setup neovim plugins
      command: |
        [ ! -x /opt/homebrew/bin/brew ] || eval "$(/opt/homebrew/bin/brew shellenv)"
        nvim --headless -c "lua vim.pack.update(nil, { target = 'lockfile' })" -c "w" -c "qa"
    - description: Merge tracked Claude settings into ~/.claude/settings.json
      command: |
        [ ! -x /opt/homebrew/bin/brew ] || eval "$(/opt/homebrew/bin/brew shellenv)"
        mkdir -p ~/.claude
        live=~/.claude/settings.json
        # Tools like Orca write hooks into the live file, so it can't be a symlink; tracked keys win, the rest is kept.
        [ -s "$live" ] || echo '{}' > "$live"
        jq -s '.[0] * .[1]' "$live" claude/settings.json > "$live.tmp" && mv "$live.tmp" "$live"
